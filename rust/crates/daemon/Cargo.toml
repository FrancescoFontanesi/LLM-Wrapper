[package]
name = "llm-wrapper-daemon"
description = "llm-wrapperd: the GTK4 + WebKitGTK window and its control socket"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
# std::fs::File::try_lock (single-instance lock) is stable since 1.89
rust-version = "1.89"

[[bin]]
name = "llm-wrapperd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
llm-wrapper-protocol = { path = "../protocol" }
llm-wrapper-platform = { path = "../platform" }
gtk4 = "0.10"
webkit6 = "0.5"
serde_json = "1"
